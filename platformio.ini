; AirGuard IoT - PlatformIO project
;   pio run                      build (default: ESP32 DevKit + DHT11)
;   pio run -t upload            flash
;   pio device monitor           serial console (115200)
;   make -C tests                host unit tests (no hardware needed)
;
; Two boards share the same source; board-specific code is only in
; src/platform/board.h and src/config/hardware_pins.h.

[platformio]
default_envs = esp32dev

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit AHTX0 @ ^2.0.5

; ---------------------------------------------------------------------------
; ESP32 DevKit (ESP32-WROOM-32, "DOIT ESP32 DEVKIT V1" / "ESP32-DevKitC")
; ---------------------------------------------------------------------------
[esp32_base]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; Default: DHT11 module (installed sensor)
[env:esp32dev]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D AIRGUARD_ENV_SENSOR_DHT11

[env:esp32dev_dht22]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D AIRGUARD_ENV_SENSOR_DHT22

[env:esp32dev_aht20]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -D AIRGUARD_ENV_SENSOR_AHT20

; ---------------------------------------------------------------------------
; Waveshare RP2040-Zero (original target). Earle Philhower's Arduino-Pico core
; via Max Gerhardt's community platform (docs/09_build_flash.md).
; ---------------------------------------------------------------------------
[rp2040_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
build_unflags = -std=gnu++14
build_flags =
    ${common.build_flags}
    ; printf/snprintf with %f (logs and OLED). The Arduino IDE adds this for
    ; Arduino-Pico; its PlatformIO build script does not.
    -Wl,-u,_printf_float
lib_deps = ${common.lib_deps}

[env:rp2040zero]
extends = rp2040_base
build_flags = ${rp2040_base.build_flags} -D AIRGUARD_ENV_SENSOR_DHT11

[env:rp2040zero_dht22]
extends = rp2040_base
build_flags = ${rp2040_base.build_flags} -D AIRGUARD_ENV_SENSOR_DHT22

[env:rp2040zero_aht20]
extends = rp2040_base
build_flags = ${rp2040_base.build_flags} -D AIRGUARD_ENV_SENSOR_AHT20
