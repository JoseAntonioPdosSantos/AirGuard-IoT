; AirGuard IoT node - PlatformIO project (ESP32 DevKit + DHT11)
;   pio run                      build
;   pio run -t upload            flash
;   pio device monitor           serial console (115200)
;   make -C tests                host unit tests (no hardware needed)
;
; The receiver is a separate project in receiver/ (RP2040-Zero).
; The original RP2040-Zero version of this node is on branch main.

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
