; AirGuard Receiver - PlatformIO project (run from this folder)
;   cd receiver && pio run -t upload       build + flash the RP2040-Zero
;   make -C receiver/tests                 host unit tests

[platformio]
default_envs = rp2040zero

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wl,-u,_printf_float
    ; LCD on GP10 (SDA) / GP3 (SCL) = I2C1. The LCD library uses `Wire`, so map Wire to i2c1.
    -D__WIRE0_DEVICE=i2c1
    -D__WIRE1_DEVICE=i2c0
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
