; AirGuard IoT - PlatformIO project
;   pio run                      build
;   pio run -t upload            flash (BOOTSEL / picotool)
;   pio device monitor           serial console (115200)
;   make -C tests                host unit tests (no hardware needed)

[platformio]
default_envs = rp2040zero

[env]
; Earle Philhower's Arduino-Pico core. The official "raspberrypi" platform
; ships only the Mbed core (no EEPROM emulation, no rp2040.wdt_*), so the
; community platform maintained by Max Gerhardt is used. docs/09_build_flash.md
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; printf/snprintf with %f (logs and OLED). The Arduino IDE adds this for
    ; Arduino-Pico; its PlatformIO build script does not.
    -Wl,-u,_printf_float
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit AHTX0 @ ^2.0.5

; Default: DHT11 module on GP28 (installed sensor)
[env:rp2040zero]
build_flags =
    ${env.build_flags}
    -D AIRGUARD_ENV_SENSOR_DHT11

; Alternative: DHT22 / AM2302 on the same pin
[env:rp2040zero_dht22]
build_flags =
    ${env.build_flags}
    -D AIRGUARD_ENV_SENSOR_DHT22

; Alternative: AHT20 on the shared I2C0 bus (GP4/GP5, address 0x38)
[env:rp2040zero_aht20]
build_flags =
    ${env.build_flags}
    -D AIRGUARD_ENV_SENSOR_AHT20
